baseURL: 'https://blog.yexca.net/'
languageCode: zh-cn
title: "yexca'Blog"
theme: 'hugo-theme-stack'
copyright: yexca

defaultContentLanguage: 'zh-cn'
defaultContentLanguageInSubdir: false

hasCJKLanguage: true

languages:
  zh-cn:
    contentDir: 'content/zh-cn'
    disabled: false
    languageCode: 'zh-cn'
    languageDirection: 'ltr'
    languageName: '简体中文'
    title: "yexca'Blog"
    weight: 1
    params:
      description: "yexca 的技术与生活博客，记录编程学习与生活随想。"
      sidebar:
        subtitle: 把这个不美好的世界，编程您所期望的样子吧！
    menus:
      main:
        - name: 分类
          url: /categories/
          weight: 2
          params:
            icon: categories
        - name: 标签
          url: /tags/
          weight: 3
          params:
            icon: tag
  zh-tw:
    contentDir: 'content/zh-tw'
    disabled: false
    languageCode: 'zh-tw'
    languageDirection: 'ltr'
    languageName: '正體中文'
    title: "yexca'Blog"
    weight: 2
    params:
      description: "yexca 的技術與生活部落格，紀錄程式學習與日常隨筆。"
      sidebar:
        subtitle: 把這個不美好的世界，編程您所期望的樣子吧！
    menus:
      main:
        - name: 類別
          url: /zh-tw/categories/
          weight: 2
          params:
            icon: categories
        - name: 標籤
          url: /zh-tw/tags/
          weight: 3
          params:
            icon: tag
  en:
    contentDir: 'content/en-us'
    disabled: false
    languageCode: 'en'
    languageDirection: 'ltr'
    languageName: 'English'
    title: "yexca'Blog"
    weight: 3
    params:
      description: "yexca's tech and life blog, writing about coding, projects, and daily thoughts."
      sidebar:
        subtitle: "Tech Otakus Change The World"
    menus:
      main:
        - name: Categories
          url: /en/categories/
          weight: 2
          params:
            icon: categories
        - name: Tags
          url: /en/tags/
          weight: 3
          params:
            icon: tag
  ja:
    contentDir: 'content/ja-jp'
    disabled: false
    languageCode: 'ja'
    languageDirection: 'ltr'
    languageName: '日本語'
    title: "yexca'Blog"
    weight: 4
    params:
      description: "yexca の技術と生活のブログ。プログラミングや日常の記録を掲載。"
      sidebar:
        subtitle: "この世で道が尽きることはなく、行きたいと望む心があれば、道は必ず足元に広がる"
    menus:
      main:
        - name: カテゴリー
          url: /ja/categories/
          weight: 2
          params:
            icon: categories
        - name: タグ
          url: /ja/tags/
          weight: 3
          params:
            icon: tag

pagination:
    pagerSize: 10

permalinks:
    posts: /archives/:slug/
    page: /:slug/

pygmentsUseClasses: true

params:
  background:
    image: https://github.com/yexca/picx-images-hosting/raw/master/2023/04-%e7%bd%91%e7%ab%99%e8%83%8c%e6%99%af/blog-background.2p10z489pjc0.webp
    local: true
    size: cover
    position: center
    attachment: fixed
  article:
    math: false

markup:
  highlight:
    noClasses: false
    style: monokai
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\\[', '\\]']]
          inline: [['$', '$'], ['\\(', '\\)']]
