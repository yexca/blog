{{- with .Site.Params.comments.twikoo -}}
<div
    id="tcomment"
    data-twikoo
    data-twikoo-cdn="https://cdn.jsdelivr.net/npm/twikoo@{{ .version | default "2.0.17" }}/dist/twikoo.all.min.js"
    data-env-id="{{ .envId }}"
    {{ with .region }}data-region="{{ . }}"{{ end }}
    {{ with .path }}data-path="{{ . }}"{{ end }}
    {{ with .lang }}data-lang="{{ . }}"{{ end }}
></div>
{{- end -}}
