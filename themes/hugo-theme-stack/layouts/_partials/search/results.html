<div
    class="search-result"
    data-search-result
    data-result-title-template="{{ T `search.resultTitle` }}"
    data-loading-template="{{ T `search.loading` }}"
    data-empty-template="{{ T `search.empty` }}"
    data-error-template="{{ T `search.error` }}"
    hidden
>
    <h3 class="search-result--title section-title" hidden></h3>
    <p class="search-result--message" data-search-message aria-live="polite" hidden></p>
    <div class="search-result--list article-list--compact" hidden></div>

    <nav
        class="pagination search-pagination"
        data-search-pagination
        data-page-size="10"
        data-page-status-template="{{ T `search.pageStatus` }}"
        aria-label="{{ T `search.pagination` }}"
        hidden
    >
        <button
            class="page-link search-pagination-control"
            type="button"
            data-search-prev
            aria-label="{{ T `search.previous` }}"
            title="{{ T `search.previous` }}"
            disabled
        >
            {{ partial "helper/icon" "arrow-back" }}
        </button>

        <div class="pagination-links" data-search-page-links></div>

        <button
            class="page-link search-pagination-control search-pagination-control--next"
            type="button"
            data-search-next
            aria-label="{{ T `search.next` }}"
            title="{{ T `search.next` }}"
            disabled
        >
            {{ partial "helper/icon" "arrow-back" }}
        </button>

        <span class="search-pagination-status" data-search-page-status aria-live="polite"></span>
    </nav>
</div>
