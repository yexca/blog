{{ $type := .Get "type" | default "" }}

<div class="notice {{ $type }}">
  {{- if eq $type "info" -}}<strong>ℹ️</strong>
  {{- else if eq $type "warn" -}}<strong>⚠️</strong>
  {{- else if eq $type "danger" -}}<strong>🚫</strong>
  {{- else -}}<strong>📢</strong>
  {{- end -}} {{ .Inner }}
</div>

<style lang="scss">
.notice {
  padding: 0.75em 1em;
  margin: 1em 0;
  border-left: 4px solid;
  border-radius: 4px;
  background-color: var(--card-background-secondary);
  color: var(--card-text-color-main);
  backdrop-filter: saturate(var(--glass-saturation)) blur(var(--glass-blur));
  -webkit-backdrop-filter: saturate(var(--glass-saturation)) blur(var(--glass-blur));

  &.default {
    border-color: #ccc;
  }

  &.info {
    border-color: #2196f3;
    color: #1a237e;
  }

  &.warn {
    border-color: #ff9800;
    color: #e65100;
  }

  &.danger {
    border-color: #f44336;
    color: #b71c1c;
  }
}

/*  // 夜间模式  */
[data-scheme="dark"] {
  .notice {
    &.default {
      border-color: #666;
      color: #eee;
    }
    
    &.info {
      border-color: #90caf9;
      color: #e3f2fd;
    }

    &.warn {
      border-color: #ffb74d;
      color: #fff3e0;
    }

    &.danger {
      border-color: #ef5350;
      color: #ffebee;
    }
  }
}

/*  // 复古模式（sepia）  */
[data-scheme="sepia"] {
  .notice {
    &.info {
      border-color: #6a5acd;
      color: #3c2f2f;
    }

    &.warn {
      border-color: #e9967a;
      color: #5c4033;
    }

    &.danger {
      border-color: #cd5c5c;
      color: #7b3f3f;
    }
  }
}

</style>
